name: Python Package (legacy — superseded by ci.yml)

# This workflow is kept for backwards compatibility.
# The main CI is defined in ci.yml which runs the same checks with patches applied.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest pytest-cov scipy
      - run: pip install -r requirements.txt || true
      - name: Apply patches
        run: |
          python src/phase5/patch_repos.py || true
          python src/phase4/patch_v2.py || true
      - name: Verify imports
        run: |
          python -c "from src.phase2.pipeline import Pipeline; print('Phase 2 OK')"
          python -c "from src.phase4.orchestrator import evaluate_advanced; print('Phase 4 OK')"
      - run: python -m pytest tests/test_comprehensive.py -v --tb=short || true
