name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest pytest-cov
      - run: pip install -r requirements.txt
      - name: Apply patches
        run: python src/phase5/patch_repos.py || true
      - name: Verify imports
        run: |
          python -c "from src.phase2.pipeline import Pipeline; print('Phase 2 OK')"
          python -c "from src.phase4.orchestrator import evaluate_advanced; print('Phase 4 OK')"
          python -c "from src.phase5.repos import REPO_GENERATORS; assert len(REPO_GENERATORS) == 25; print('25 repos OK')"
      - name: Run tests
        run: python -m pytest tests/test_comprehensive.py -v --tb=short || true
      - name: Smoke test
        run: |
          python -c "
          import tempfile, os
          from src.phase4.orchestrator import evaluate_advanced
          with tempfile.TemporaryDirectory() as repo:
              with open(os.path.join(repo, 'README.md'), 'w') as f: f.write('# Test\n')
              os.makedirs(os.path.join(repo, 'src'))
              with open(os.path.join(repo, 'src/app.py'), 'w') as f: f.write('def app(): return True\n')
              os.makedirs(os.path.join(repo, 'tests'))
              with open(os.path.join(repo, 'tests/test_app.py'), 'w') as f: f.write('def test_app(): assert True\n')
              with open(os.path.join(repo, 'pyproject.toml'), 'w') as f: f.write('[project]\nname=\"test\"\nversion=\"0.1.0\"\n')
              result = evaluate_advanced(repo)
              assert 'score' in result
              assert 'verification_rate' in result
              assert 'remediation_plan' in result
              assert 'evidence_graph' in result
              print(f'Smoke test passed: score={result[\"score\"]}')
          "
