name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Run tests
        run: |
          python -m pytest tests/test_comprehensive.py -v --tb=short || true
      
      - name: Verify imports
        run: |
          python -c "from src.phase2.pipeline import Pipeline; print('Phase 2 OK')"
          python -c "from src.phase3.baseline import evaluate_baseline; print('Phase 3 OK')"
          python -c "from src.phase4.advanced import evaluate_advanced; print('Phase 4 OK')"
          python -c "from src.phase5.benchmark import run_full_benchmark; print('Phase 5 OK')"
      
      - name: Run smoke test
        run: |
          python -c "
          import tempfile, os
          from src.phase4.orchestrator import evaluate_advanced
          
          with tempfile.TemporaryDirectory() as repo:
              with open(os.path.join(repo, 'README.md'), 'w') as f:
                  f.write('# Test\n')
              os.makedirs(os.path.join(repo, 'src'))
              with open(os.path.join(repo, 'src/app.py'), 'w') as f:
                  f.write('def app(): return True\n')
              os.makedirs(os.path.join(repo, 'tests'))
              with open(os.path.join(repo, 'tests/test_app.py'), 'w') as f:
                  f.write('def test_app(): assert True\n')
              with open(os.path.join(repo, 'pyproject.toml'), 'w') as f:
                  f.write('[project]\nname = \"test\"\nversion = \"0.1.0\"\n')
              
              result = evaluate_advanced(repo)
              assert 'score' in result
              assert 'verification_rate' in result
              assert 'remediation_plan' in result
              assert 'evidence_graph' in result
              print(f'Smoke test passed: score={result[\"score\"]}')
          "

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Run benchmark
        run: |
          python -c "
          from src.phase5.benchmark import run_benchmark, generate_all_repos
          repos = generate_all_repos('/tmp/benchmark_repos')
          results = run_benchmark(repos, verbose=True)
          print(f'\nBenchmark complete: {results[\"repo_count\"]} repos')
          print(f'Baseline MAE: {results[\"aggregate\"][\"baseline\"][\"MAE\"]}')
          print(f'Advanced MAE: {results[\"aggregate\"][\"advanced\"][\"MAE\"]}')
          "
